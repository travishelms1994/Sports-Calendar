name: Update calendars

on:
  # Every 4 hours at 1:30, 5:30 and 9:30 (AM and PM) Central time, all year.
  # GitHub schedules run on UTC, so both the daylight-time (CDT) and
  # standard-time (CST) versions are listed; the "when" job below lets only
  # the one that matches the current Central offset go ahead.
  schedule:
    - cron: "30 2,6,10,14,18,22 * * *"   # = 1:30/5:30/9:30 CDT
    - cron: "30 3,7,11,15,19,23 * * *"   # = 1:30/5:30/9:30 CST
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  actions: write            # lets the job keep its own schedule switched on
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            offset=$(TZ=America/Chicago date +%z)   # -0500 in daylight time, -0600 in standard
            if [ "$offset" = "-0500" ] && [ "$CRON" != "30 2,6,10,14,18,22 * * *" ]; then go=false; fi
            if [ "$offset" = "-0600" ] && [ "$CRON" != "30 3,7,11,15,19,23 * * *" ]; then go=false; fi
          fi
          echo "Central offset $(TZ=America/Chicago date +%z), schedule '$CRON', go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sports.py site
      - run: cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses schedules in projects with no changes for 60 days;
      # re-enabling the workflow on every run keeps it going.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
