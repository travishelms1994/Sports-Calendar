name: Update calendars

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  actions: write            # lets the job keep its own schedule switched on
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sports.py site
      - run: cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses schedules in projects with no changes for 60 days;
      # re-enabling the workflow on every run keeps it going.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
